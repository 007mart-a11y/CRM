{% extends 'base.html' %}
{% block title %}Přidat klienta{% endblock %}

{% block content %}
<div class="mb-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-1">
      <li class="breadcrumb-item"><a href="{{ url_for('clients_list') }}">Klienti</a></li>
      <li class="breadcrumb-item active">Přidat klienta</li>
    </ol>
  </nav>
  <h2 class="fw-bold mb-0">Přidat klienta</h2>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Jméno / Název <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required autofocus placeholder="Jan Novák nebo Firma s.r.o.">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Firma</label>
            <input type="text" name="company" class="form-control" placeholder="Název firmy">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">URL webu</label>
            <input type="url" name="website_url" class="form-control" placeholder="https://example.cz">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">E-mail</label>
            <input type="email" name="email" class="form-control" placeholder="kontakt@example.cz">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Telefon</label>
            <input type="text" name="phone" class="form-control" placeholder="+420 123 456 789">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Status</label>
            <select name="status" class="form-select">
              <option value="new">Nový</option>
              <option value="contacted">Osloven</option>
              <option value="responded">Odpověděl</option>
              <option value="closed">Uzavřen</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-plus-lg me-1"></i>Přidat klienta
            </button>
            <a href="{{ url_for('clients_list') }}" class="btn btn-outline-secondary">Zrušit</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
