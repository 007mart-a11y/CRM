{% extends 'base.html' %}
{% block title %}Upravit – {{ client.name }}{% endblock %}

{% block content %}
<div class="mb-4">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-1">
      <li class="breadcrumb-item"><a href="{{ url_for('clients_list') }}">Klienti</a></li>
      <li class="breadcrumb-item"><a href="{{ url_for('client_detail', client_id=client.id) }}">{{ client.name }}</a></li>
      <li class="breadcrumb-item active">Upravit</li>
    </ol>
  </nav>
  <h2 class="fw-bold mb-0">Upravit klienta</h2>
</div>

<div class="row">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Jméno / Název <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required value="{{ client.name }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Firma</label>
            <input type="text" name="company" class="form-control" value="{{ client.company or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">URL webu</label>
            <input type="url" name="website_url" class="form-control" value="{{ client.website_url or '' }}" placeholder="https://example.cz">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">E-mail</label>
            <input type="email" name="email" class="form-control" value="{{ client.email or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Telefon</label>
            <input type="text" name="phone" class="form-control" value="{{ client.phone or '' }}">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Status</label>
            <select name="status" class="form-select">
              <option value="new" {% if client.status == 'new' %}selected{% endif %}>Nový</option>
              <option value="contacted" {% if client.status == 'contacted' %}selected{% endif %}>Osloven</option>
              <option value="responded" {% if client.status == 'responded' %}selected{% endif %}>Odpověděl</option>
              <option value="closed" {% if client.status == 'closed' %}selected{% endif %}>Uzavřen</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Uložit změny
            </button>
            <a href="{{ url_for('client_detail', client_id=client.id) }}" class="btn btn-outline-secondary">Zrušit</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
