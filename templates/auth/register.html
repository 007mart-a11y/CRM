{% extends 'base.html' %}
{% block title %}Registrace{% endblock %}

{% block content_unauth %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-diagram-3-fill fs-1 text-primary"></i>
          <h3 class="mt-2 fw-bold">MyCRM</h3>
          <p class="text-muted">Vytvořte si nový účet</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Uživatelské jméno <span class="text-danger">*</span></label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Heslo <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control" required minlength="6">
            <div class="form-text">Minimálně 6 znaků.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Heslo znovu <span class="text-danger">*</span></label>
            <input type="password" name="password2" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Registrovat se</button>
        </form>
        <hr>
        <p class="text-center mb-0">Máte účet? <a href="{{ url_for('login') }}">Přihlásit se</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock content_unauth %}
