{% extends 'base.html' %}
{% block title %}Přihlášení{% endblock %}

{% block content_unauth %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-diagram-3-fill fs-1 text-primary"></i>
          <h3 class="mt-2 fw-bold">MyCRM</h3>
          <p class="text-muted">Přihlaste se ke svému účtu</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Uživatelské jméno</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Heslo</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" name="remember" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Zapamatovat si mě</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">Přihlásit se</button>
        </form>
        <hr>
        <p class="text-center mb-0">Nemáte účet? <a href="{{ url_for('register') }}">Registrovat se</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock content_unauth %}
