services:
  - type: web
    name: mycrm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mycrm-db
          property: connectionString

databases:
  - name: mycrm-db
    databaseName: crm
    user: crm
